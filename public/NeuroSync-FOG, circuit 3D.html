wire(10,'#d62828',[3.3,.4,4.2],[.8,.5,4.2],1.1);wire(10,'#202328',[3.3,.4,4.8],[.8,.5,4.8],.6);
wire(10,'#d62828',[.3,.5,3.8],[1.9,.5,3.75],.8);wire(10,'#d62828',[2.9,.5,3.75],L(14),1.2);
wM.push(wire(10,'#d62828',[2.9,.5,3.75],[8.5,.45,3.4],2.2));wire(10,'#202328',[-.7,.5,3.8],[-6.4,.5,2.65],1.4);
const CO=[['ESP32 DevKit',[2.5,1.5,-.6],1],['MPU-6050',[8.2,1.8,.2],2],['Résistance 220 Ω',[-1.9,1.2,-1.2],3],['LED rouge',[-4.8,2,-1.2],4],['Buzzer',[-3.2,2.2,2.2],5],['Borne GND',[-6.4,.9,.7],gb],['Moteur vibrant',[9,1.5,4.7],gm],['Batterie LiPo',[5.3,1.1,4.5],gp],['Chargeur TP4056',[-.2,1,4.5],gp]].map(([t,p,g])=>{const e=document.createElement('div');e.className='co';e.textContent=t;vw.appendChild(e);return{e,v:new T.Vector3(...p),g}});
let lab=true,goal;$('tg').onclick=()=>lab=!lab;
function callouts(){const W=vw.clientWidth,H=vw.clientHeight;CO.forEach(o=>{const q=o.v.clone().project(cam),ok=lab&&G[o.g].p>.95&&q.z<1;o.e.style.display=ok?'block':'none';if(ok)o.e.style.transform='translate('+(q.x+1)/2*W+'px,'+(1-q.y)/2*H+'px) translate(-50%,-130%)'})}
const V=[[[1,15,17],[1.5,0,.5]],[[1.5,26,.1],[1.5,0,.5]],[[10.5,5.5,6.5],[8.2,.6,.2]],[[5.5,6,9],[2.5,.5,0]],[[6.5,8,12],[4.5,.3,3.6]]];
document.querySelectorAll('#tb [data-v]').forEach(b=>b.onclick=()=>{const v=V[b.dataset.v];goal={p:new T.Vector3(...v[0]),t:new T.Vector3(...v[1])};ctl.autoRotate=false});
ctl.addEventListener('start',()=>{goal=null;ctl.autoRotate=false});
$('wt').innerHTML=[['#d62828','3V3','VCC du MPU-6050'],['#202328','GND (droite)','GND du MPU-6050'],['#2ec4b6','GPIO21','SDA'],['#9bdc3c','GPIO22','SCL'],['#ff9f1c','GPIO25','220 Ω puis LED'],['#f6d743','GPIO26','Buzzer +'],['#202328','GND (gauche)','Borne GND (LED −, buzzer −, TP4056 OUT −)'],['#c77dff','GPIO27','1 kΩ puis base du 2N2222'],['#4895ef','Collecteur 2N2222','Moteur −'],['#202328','GND (droite)','Émetteur 2N2222'],['#d62828','VIN','Sortie interrupteur (batterie +)'],['#d62828','Sortie interrupteur','Moteur + (diode 1N4148 en parallèle)'],['#d62828','TP4056 B+ / B−','Batterie LiPo 3,7 V']].map(r=>'<tr><td><i style="background:'+r[0]+'"></i>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('');
const ar=new T.ArrowHelper(new T.Vector3(0,1,0),new T.Vector3(8.5,1.3,.2),2,0x4cc9f0,.5,.3);sc.add(ar);
sc.traverse(o=>{if(o.isMesh&&!o.material.transparent)o.castShadow=o.receiveShadow=true});

const ST=[['Plateau porteur','base du wearable avec vis et sérigraphie.'],['ESP32 DevKit','le microcontrôleur, USB vers le bas, 15 broches de chaque côté.'],['MPU-6050 (GY-521)','accéléromètre I²C à l’adresse 0x68, plage ±2 g.'],['Résistance 220 Ω','en série avec la LED pour limiter le courant.'],['LED rouge','cue visuel, allumée pendant le gel de la marche.'],['Buzzer','cue sonore, piloté avec la LED.'],['Alimentation','3V3 vers VCC (rouge), GND vers GND (noir).'],['Bus I²C','SDA vers GPIO21 (turquoise), SCL vers GPIO22 (vert).'],['Sorties du cue','GPIO25 vers résistance et LED, GPIO26 vers buzzer, masses communes.'],['Moteur vibrant','moteur à pastille 3 V commandé par GPIO27 via une résistance 1 kΩ et un transistor NPN 2N2222, avec une diode 1N4148 en parallèle du moteur. Il vibre avec la LED et le buzzer.'],['Batterie et alimentation','LiPo 3,7 V avec module de charge TP4056 (USB-C), interrupteur, sortie vers VIN et masse commune. Circuit terminé.']];
let step=0,au;
function setStep(n){step=Math.max(0,Math.min(10,n));$('sl').textContent='étape '+(step+1)+' sur 11';$('sd').innerHTML='<b>'+ST[step][0]+'</b> : '+ST[step][1]}
const stopAuto=()=>clearInterval(au);
function play(){stopAuto();setStep(0);au=setInterval(()=>{if(step>=10){stopAuto();ctl.autoRotate=true;ctl.autoRotateSpeed=.6}else setStep(step+1)},1000)}
$('bp').onclick=()=>{stopAuto();setStep(step-1)};$('bn').onclick=()=>{stopAuto();setStep(step+1)};$('ba').onclick=play;

let S,run=0,spd=1,clk=0,ac,gn;
function reset(){S={ms:0,nx:0,cue:false,out:[],n:0,halt:false,st:0,t:0,az:9.8,buf:[],cb:[]};run=0;$('go').textContent='▶ Démarrer';$('ser').textContent=''}
function log(s){S.out.push(s);if(S.out.length>13)S.out.shift();S.n++}
function tick(){const now=S.nx;S.nx+=10;const t=now/1000;S.t=t;const a=+$('cs').value,b=+$('ce').value;
if(t>=a&&t<b)S.cue=true;else if(t>=b&&t<b+.05)S.cue=false;
if(t>60){S.halt=true;return}
const w=3*Math.sin(2*PI*1.8*t),f=t>=20&&t<30,az=9.8+(f?.3*w+1.5*Math.sin(2*PI*5.5*t):w);S.az=az;
S.buf.push(az);S.cb.push(S.cue?1:0);if(S.buf.length>600){S.buf.shift();S.cb.shift()}
log(t.toFixed(2)+',0.000,0.000,'+az.toFixed(3))}
function aud(){try{ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator();gn=ac.createGain();o.type='square';o.frequency.value=2600;gn.gain.value=0;o.connect(gn);gn.connect(ac.destination);o.start()}catch(e){}}
$('go').onclick=()=>{stopAuto();if(S.halt)reset();setStep(10);if(!ac)aud();if(ac&&ac.resume)ac.resume();run=run?0:1;
if(run&&!S.st){S.st=1;log('NeuroSync-FOG started');log('timestamp,ax,ay,az')}$('go').textContent=run?'⏸ Pause':'▶ Reprendre'};
$('rs').onclick=reset;$('sp').onchange=e=>spd=+e.target.value;
$('s1').onclick=()=>{if(!S.halt)S.cue=true};$('s0').onclick=()=>{if(!S.halt)S.cue=false};

function chart(){const q=$('ch'),g=q.getContext('2d'),W=q.width,H=q.height,n=S.buf.length,X=i=>i*W/600,Y=v=>H-(v-5)/10*H;g.clearRect(0,0,W,H);
g.lineWidth=1;g.strokeStyle='rgba(128,140,155,.55)';g.beginPath();g.moveTo(0,Y(9.8));g.lineTo(W,Y(9.8));g.stroke();
g.fillStyle='rgba(255,59,59,.24)';for(let i=0;i<n;i++)if(S.cb[i])g.fillRect(X(i),0,X(1)+1,H);
g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ac');g.lineWidth=2.5;g.beginPath();
for(let i=0;i<n;i++)i?g.lineTo(X(i),Y(S.buf[i])):g.moveTo(X(i),Y(S.buf[i]));g.stroke();
g.fillStyle='#8b9bab';g.font='20px system-ui,sans-serif';g.fillText('az en m/s², 6 s glissantes, zone rouge = cue actif',8,24)}

const ck=new T.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(ck.getDelta(),.1);clk+=dt;
if(run&&!S.halt){S.ms+=dt*1000*spd;while(S.nx<=S.ms&&!S.halt)tick()}
if(S.halt&&run){run=0;$('go').textContent='↺ Rejouer'}
G.forEach(g=>{g.p+=((step>=g.s?1:0)-g.p)*Math.min(1,dt*5);g.o.visible=g.p>.01;if(g.w)g.o.geometry.setDrawRange(0,(g.o.geometry.index.count*g.p)|0);else g.o.position.y=(1-g.p)*6});
const on=S.cue,act=run&&!S.halt;
lm.emissiveIntensity+=((on?2.4:.05)-lm.emissiveIntensity)*Math.min(1,dt*20);ll.intensity=(lm.emissiveIntensity-.05)*1.6;glow.material.opacity=Math.min(1,(lm.emissiveIntensity-.05)/2.2);
rings.forEach((r,i)=>{const ph=(clk*1.4+i/3)%1;r.scale.setScalar(1+ph*1.5);r.material.opacity=on?(1-ph)*.8:0});bz.position.x=on?Math.sin(clk*110)*.02:0;
mb.position.y=(S.az-9.8)*.045;mb.rotation.z=(S.az-9.8)*.01;
ar.visible=G[2].p>.9;ar.setLength(Math.max(.3,S.az*.2),.5,.3);ar.setColor(on?0xff4d4d:0x4cc9f0);
wSDA.emissiveIntensity=act?.45+.45*Math.sin(clk*34):0;wSCL.emissiveIntensity=act?.45+.45*Math.cos(clk*34):0;wC.forEach(m=>m.emissiveIntensity=on?1:0);wM.forEach(m=>m.emissiveIntensity=on?1:0);mo.position.set(9+(on?Math.sin(clk*140)*.035:0),0,4.7+(on?Math.cos(clk*170)*.03:0));mr.forEach((r,i)=>{const ph=(clk*2.2+i/2)%1;r.scale.setScalar(1+ph*1.1);r.material.opacity=on?(1-ph)*.7:0});
if(gn)gn.gain.setTargetAtTime(on&&$('snd').checked?.04:0,ac.currentTime,.01);
$('hud').innerHTML='t = '+S.t.toFixed(2)+' s<i class="'+(on?'on':'')+'" style="margin-left:14px"></i>LED 25<i class="'+(on?'on':'')+'"></i>Buzzer 26<i class="'+(on?'on':'')+'"></i>Moteur 27'+(S.halt?' &nbsp;fin du sketch à 60 s':'');
$('ser').textContent=S.out.join('\n');$('nl').textContent=S.n+' lignes, 115200 bauds';chart();if(goal){cam.position.lerp(goal.p,.07);ctl.target.lerp(goal.t,.07);if(cam.position.distanceTo(goal.p)<.05)goal=null}ctl.update();callouts();rd.render(sc,cam)}
reset();matchMedia('(prefers-reduced-motion:reduce)').matches?setStep(8):play();frame();
</script></body></html>
